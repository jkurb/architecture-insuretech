# Service для доступа к тестовому приложению.
# Тип NodePort — чтобы работала команда `minikube service test-app --url`.
apiVersion: v1
kind: Service
metadata:
  name: test-app
  labels:
    app: test-app
spec:
  type: NodePort
  selector:
    app: test-app
  ports:
    - name: http          # имя порта используется ServiceMonitor'ом (Часть 2)
      port: 8080
      targetPort: 8080
      protocol: TCP
