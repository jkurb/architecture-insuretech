# Часть 1. HPA по утилизации оперативной памяти.
# Целевая утилизация = 80% (от memory request = 30Mi, т.е. ~24Mi), максимум 10 реплик.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: test-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: test-app
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
