# =============================================================================
# GraphQL-схема сервиса client-info (Задание 5)
# Эквивалент REST-контракта (Swagger 2.0) сервиса управления клиентскими данными.
#
# Идея перевода: три отдельных REST-ресурса (клиент, документы, родственники)
# образуют граф вокруг клиента. Коллекции documents/relatives становятся
# вложенными полями типа Client — потребитель одним запросом выбирает только
# нужные поля и ветви. Это устраняет N-кратный RPS (несколько ресурсов в одном
# сценарии) и overfetching (карточка из ~500 атрибутов).
# =============================================================================

schema {
  query: Query
}

# -----------------------------------------------------------------------------
# Корневые запросы
# Покрывают все три операции REST. Основная точка входа — client(id):
# вложенность documents/relatives заменяет /clients/{id}/documents и
# /clients/{id}/relatives. Дополнительно сохранены прямые запросы коллекций —
# эквивалент отдельных REST-ресурсов, когда сам клиент потребителю не нужен.
# -----------------------------------------------------------------------------
type Query {
  """
  Информация о клиенте по ID вместе с любым набором связанных данных.
  Эквивалент: GET /clients/{id} (+ вложенно — documents и relatives).
  Возвращает null, если клиент не найден.
  """
  client(id: ID!): Client

  """
  Список документов клиента.
  Эквивалент: GET /clients/{id}/documents.
  """
  clientDocuments(clientId: ID!): [Document!]!

  """
  Список родственников клиента.
  Эквивалент: GET /clients/{id}/relatives.
  """
  clientRelatives(clientId: ID!): [Relative!]!
}

# -----------------------------------------------------------------------------
# Сущности
# -----------------------------------------------------------------------------

"""
Клиент. Скалярные поля (definitions.Client) дополнены связями documents и
relatives — каждый потребитель запрашивает ровно нужную часть карточки.
"""
type Client {
  "Идентификатор клиента"
  id: ID!
  "Имя клиента"
  name: String
  "Возраст клиента"
  age: Int

  "Документы клиента. Эквивалент: GET /clients/{id}/documents"
  documents: [Document!]!
  "Родственники клиента. Эквивалент: GET /clients/{id}/relatives"
  relatives: [Relative!]!
}

"Документ клиента (definitions.Document)"
type Document {
  "Идентификатор документа"
  id: ID!
  "Тип документа (паспорт, СНИЛС, водительское удостоверение и т.д.)"
  type: String
  "Номер документа"
  number: String
  "Дата выдачи (ISO 8601)"
  issueDate: String
  "Дата окончания срока действия (ISO 8601)"
  expiryDate: String
}

"Родственник клиента (definitions.Relative)"
type Relative {
  "Идентификатор родственника"
  id: ID!
  "Тип родства (супруг, ребёнок, родитель и т.д.)"
  relationType: String
  "Имя родственника"
  name: String
  "Возраст родственника"
  age: Int
}
