http {
    # --- Rate Limiting (Задание 6) ---------------------------------------
    # Зона счётчиков запросов. Ключ — IP клиента ($binary_remote_addr);
    # при идентификации партнёра по токену вместо IP можно взять, например,
    # $http_authorization или $http_x_api_key.
    # rate=10r/m — не более 10 запросов в минуту (в среднем 1 запрос / 6 c).
    # zone=partner_limit:10m — общий счётчик для всех воркеров (~160 тыс. IP).
    limit_req_zone $binary_remote_addr zone=partner_limit:10m rate=10r/m;

    # При превышении лимита отдавать HTTP 429 (по умолчанию Nginx отдаёт 503).
    limit_req_status 429;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            # Применяем ограничение скорости к этому location.
            # Без burst — запросы сверх лимита сразу отклоняются с кодом 429.
            # При необходимости сгладить короткие всплески можно добавить
            # буфер, например: limit_req zone=partner_limit burst=10 nodelay;
            limit_req zone=partner_limit;

            proxy_pass http://backend_servers;
        }

    }
}
